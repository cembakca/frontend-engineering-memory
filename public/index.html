<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Context Engine — index readout</title>
<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<a class="skip-nav" href="#main">Skip to workspace</a>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="eyebrow">Repository</div>
      <div class="brand-name">Context&nbsp;Engine</div>
    </div>
    <nav id="projects" class="projects" aria-label="Indexed repositories"></nav>
    <div class="rail-foot mono" id="railFoot"></div>
  </aside>

  <main class="main" id="main">
    <div class="empty mono" id="boot">connecting to index…</div>
  </main>
</div>

<template id="tpl-project">
  <header class="masthead">
    <div>
      <div class="eyebrow" data-slot="eyebrow"></div>
      <h1 data-slot="title"></h1>
      <p class="thesis" data-slot="guidance"></p>
    </div>
    <div class="stamp mono" data-slot="stamp"></div>
  </header>

  <section class="metrics" data-slot="metrics"></section>

  <nav class="workspace-tabs" aria-label="Repository workspace">
    <button type="button" data-view="ask" aria-selected="true"><span>01</span> Ask Memory</button>
    <button type="button" data-view="routes" aria-selected="false"><span>02</span> Routes</button>
    <button type="button" data-view="economy" aria-selected="false"><span>03</span> Economy</button>
    <button type="button" data-view="lab" aria-selected="false"><span>04</span> Index Lab</button>
  </nav>

  <section class="workspace-panel" data-panel="ask">
    <div class="workspace-intro">
      <div><div class="eyebrow">Memory query workbench</div><h2>Ask the index before opening source.</h2></div>
      <p>Inspect the exact bounded pack an MCP client receives—intent, evidence, uncertainty and targeted fallback included.</p>
    </div>
    <form class="ask-form" data-slot="askForm">
      <label for="memory-question" class="eyebrow">Question</label>
      <textarea id="memory-question" data-slot="askInput" rows="4" maxlength="2000" placeholder="Kart sihirbazı ana sayfası hangi route ve source dosyasındadır?"></textarea>
      <div class="ask-controls">
        <div class="prompt-presets" data-slot="askPresets" aria-label="Example questions"></div>
        <button class="primary-action" type="submit">Compile memory pack <span>↗</span></button>
      </div>
    </form>
    <div class="query-status mono" data-slot="askStatus" aria-live="polite">ready · no agent source fallback requested</div>
    <div class="pack-output" data-slot="askOutput" hidden></div>
  </section>

  <section class="workspace-panel" data-panel="routes" hidden>
    <div class="workspace-intro">
      <div><div class="eyebrow">Structured route inventory</div><h2>Find the runtime surface.</h2></div>
      <p>Search route identity and source together, then inspect rendering, layouts, data boundaries and dependencies without scanning the tree.</p>
    </div>
    <div class="route-explorer">
      <div class="route-index">
        <form class="route-search" data-slot="routeSearchForm">
          <label class="eyebrow" for="route-query">Filter routes</label>
          <input id="route-query" type="search" data-slot="routeSearchInput" placeholder="/kart-sihirbazi or page.tsx" autocomplete="off">
        </form>
        <div class="route-count mono" data-slot="routeCount" aria-live="polite"></div>
        <div class="route-list" data-slot="routeList"></div>
      </div>
      <article class="route-detail" data-slot="routeDetail">
        <p class="hint">Select a route to inspect its indexed runtime contract.</p>
      </article>
    </div>
  </section>

  <section class="workspace-panel" data-panel="economy" hidden>
    <div class="workspace-intro">
      <div><div class="eyebrow">MCP economy ledger</div><h2>Measure what retrieval avoided.</h2></div>
      <p>Live pack telemetry and controlled Codex A/B observations remain separate, so estimated context cost is never mistaken for model billing.</p>
    </div>
    <div class="economy-summary" data-slot="economySummary"></div>
    <div class="economy-grid">
      <section class="ledger-panel">
        <div class="panel-title"><div><div class="eyebrow">Controlled observations</div><h3>Codex A/B evidence</h3></div><span class="status-mark good">verified</span></div>
        <div data-slot="observations"></div>
      </section>
      <section class="ledger-panel">
        <div class="panel-title"><div><div class="eyebrow">Live retrievals</div><h3>Recent memory traffic</h3></div><span class="status-mark" data-slot="eventCount"></span></div>
        <div class="event-list mono" data-slot="events"></div>
      </section>
    </div>
  </section>

  <section class="workspace-panel" data-panel="lab" hidden>
  <section class="block lab-block">
    <div class="block-head">
      <div>
        <div class="eyebrow">Instrument I — the index, projected</div>
        <h2>Every fact, positioned by its own embedding</h2>
      </div>
      <div class="readout mono" data-slot="pcaNote"></div>
    </div>
    <p class="lede">Each point is one stored fact, placed by the principal components of its
      384-dimension vector. Type a question to embed it and drop it into the same space, or click a
      point to pull its nearest neighbours straight from sqlite-vec.</p>

    <div class="instrument">
      <div class="instrument-head">
        <form class="search" data-slot="searchForm" autocomplete="off">
          <input type="search" data-slot="searchInput" placeholder="embed a question and search the index…" aria-label="Vector search">
          <button type="submit">Search</button>
          <button type="button" data-slot="clearSearch" hidden>Clear</button>
        </form>
        <div class="readout mono" data-slot="shown"></div>
      </div>
      <div class="field">
        <canvas data-slot="plot"></canvas>
        <div class="panel">
          <div>
            <div class="eyebrow rail-label">Fact types</div>
            <div class="legend" data-slot="legend"></div>
          </div>
          <div class="inspect" data-slot="inspect"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="block-head">
      <div>
        <div class="eyebrow">Instrument II — the traversal</div>
        <h2>The part similarity cannot answer</h2>
      </div>
      <div class="readout mono" data-slot="graphNote"></div>
    </div>
    <p class="lede">Nearest neighbours find pieces. They cannot say what order those pieces run in,
      or where the request leaves the browser. This is a real walk over the typed symbol graph.</p>

    <div class="instrument">
      <div class="instrument-head">
        <label class="seed-pick mono">entry point
          <select data-slot="seedSelect" aria-label="Flow entry point"></select>
        </label>
        <div class="readout mono" data-slot="flowNote"></div>
      </div>
      <ol class="steps mono" data-slot="steps"></ol>
      <div class="trace-foot mono" data-slot="traceFoot"></div>
    </div>
  </section>
  </section>
</template>

<script src="/ui/app.js"></script>
</body>
</html>
